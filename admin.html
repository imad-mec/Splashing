<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Splashing</title>
<style>
body{font-family:system-ui,sans-serif;background:#FBF7F2;color:#2A1220;margin:0;padding:16px;max-width:560px;margin-inline:auto}
h1{color:#6B1D45;font-size:22px}
.box{background:#fff;border:1px solid #E9D9D3;border-radius:16px;padding:16px;margin:12px 0}
input,select,button{font:inherit;width:100%;padding:11px;margin:5px 0;border:1px solid #D9C5CC;border-radius:10px;box-sizing:border-box;background:#fff}
button{background:#3B0F2B;color:#C9A45C;border:0;font-weight:700}
button.del{background:#B3261E;color:#fff;width:auto;padding:6px 14px;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F0E4DF;font-size:14px}
#msg{font-size:14px;color:#6B1D45;min-height:20px}
label{font-size:13px;color:#8A7480}
.hide{display:none}
</style>
</head>
<body>
<h1>لوحة الإدارة · Splashing</h1>
<div id="login" class="box">
  <label>مفتاح الإدارة (GitHub token)</label>
  <input id="tok" type="password" autocomplete="off">
  <label><input id="rem" type="checkbox" style="width:auto"> تذكرني فهاد الهاتف</label>
  <button id="enter">دخول</button>
</div>
<div id="app" class="hide">
  <div class="box" id="form">
    <b>إضافة منتج جديد</b>
    <input id="n_ar" placeholder="الاسم بالعربية">
    <input id="n_fr" placeholder="Nom en français (اختياري)">
    <input id="n_en" placeholder="Name in English (optional)">
    <input id="pr" type="number" inputmode="decimal" placeholder="الثمن بالدرهم">
    <select id="cat"><option value="beauty">تجميل</option><option value="care">عناية</option><option value="kitchen">مطبخ</option><option value="jewelry">مجوهرات</option></select>
    <input id="lk" placeholder="رابط الأفلييت https://...">
    <label>صورة المنتج (من المعرض)</label>
    <input id="ph" type="file" accept="image/*">
    <input id="em" placeholder="أو إيموجي بدل الصورة (مثلا 💎)">
    <button id="add">إضافة المنتج</button>
    <div id="msg"></div>
  </div>
  <div class="box"><b>المنتجات الحالية</b><div id="list"></div></div>
  <button id="out">خروج</button>
</div>
<script>
const R="imad-mec/Splashing",API="https://api.github.com/repos/"+R+"/contents/";
const COL=["#FBE3DC","#F3DDE6","#EFE0F5","#E3EFEA","#F7EBCF","#EADFD6"];
const $=id=>document.getElementById(id);
let tok=sessionStorage.getItem("tk")||localStorage.getItem("tk")||"",items=[],sha="";
const msg=t=>$("msg").textContent=t;
const H=()=>({Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"});
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const unb64=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,""))));
async function gh(path,opt={}){
  const r=await fetch(API+path,{...opt,headers:{...H(),...(opt.headers||{})}});
  if(!r.ok)throw new Error(r.status===401?"المفتاح غير صحيح":(r.status===403||r.status===404)?"المفتاح ما عندوش صلاحية":"خطأ "+r.status);
  return r.json();
}
async function load(){const j=await gh("products.json?ref=main&t="+Date.now());sha=j.sha;items=JSON.parse(unb64(j.content));draw()}
async function save(note){
  const j=await gh("products.json",{method:"PUT",body:JSON.stringify({message:note,content:b64(JSON.stringify(items,null,1)),sha,branch:"main"})});
  sha=j.content.sha;draw();
}
function draw(){
  const L=$("list");L.textContent="";
  items.forEach((p,i)=>{
    const r=document.createElement("div");r.className="row";
    const s=document.createElement("span");s.textContent=p.n[0]+" · "+p.p+" MAD";
    const b=document.createElement("button");b.className="del";b.textContent="حذف";
    b.onclick=async()=>{if(!confirm("حذف المنتج؟"))return;try{items.splice(i,1);await save("Delete product");msg("تم الحذف")}catch(e){alert(e.message);await load()}};
    r.append(s,b);L.append(r);
  });
}
function up(f){return new Promise((res,rej)=>{
  const im=new Image();
  im.onload=async()=>{try{
    const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    const d=c.toDataURL("image/jpeg",.82).split(",")[1],name="img/"+Date.now()+".jpg";
    await gh(name,{method:"PUT",body:JSON.stringify({message:"Add image",content:d,branch:"main"})});res(name);
  }catch(e){rej(e)}};
  im.onerror=()=>rej(new Error("الصورة غير صالحة"));
  im.src=URL.createObjectURL(f);
})}
async function enter(){
  tok=$("tok").value.trim()||tok;
  try{
    const r=await fetch("https://api.github.com/repos/"+R,{headers:H()});const j=await r.json();
    if(!r.ok||!j.permissions||!j.permissions.push)throw new Error("دخول مرفوض");
    ($("rem").checked?localStorage:sessionStorage).setItem("tk",tok);
    $("login").classList.add("hide");$("app").classList.remove("hide");await load();
  }catch(e){alert(e.message)}
}
$("enter").onclick=enter;
$("out").onclick=()=>{sessionStorage.removeItem("tk");localStorage.removeItem("tk");location.reload()};
$("add").onclick=async()=>{
  try{
    const ar=$("n_ar").value.trim();if(!ar)return alert("كتب اسم المنتج");
    const price=+$("pr").value;if(!(price>0))return alert("الثمن غير صحيح");
    const l=$("lk").value.trim();if(!/^https:\/\//.test(l))return alert("الرابط خاصو يبدا بـ https://");
    msg("جاري الحفظ...");
    let img="";const f=$("ph").files[0];if(f)img=await up(f);
    items.unshift({id:"p"+Date.now(),n:[ar,$("n_fr").value.trim()||ar,$("n_en").value.trim()||ar],c:$("cat").value,p:price,e:$("em").value.trim()||"✨",img,k:COL[Math.floor(Math.random()*COL.length)],l});
    await save("Add product");
    msg("تمت الإضافة ✅ كيبان فالموقع من بعد دقيقة");
    document.querySelectorAll("#form input").forEach(i=>i.value="");
  }catch(e){msg("");alert(e.message)}
};
if(tok)enter();
</script>
</body>
</html>
